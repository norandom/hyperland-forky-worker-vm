# Managed by debian-hypr. foot: Wayland-native terminal. Colours and font come from
# the current theme (theme.ini, one of themes/*.ini, switched by hypr-termtheme;
# new foot windows pick it up).
include=~/.config/foot/theme.ini

[main]
pad=4x2

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[scrollback]
lines=100000
