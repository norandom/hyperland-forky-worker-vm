# Managed by debian-hypr. Lock screen for the Proxmox / SPICE console: RDP logs in by itself
# (hypr-rdp-session unlocks), the console needs your password. Flat, no blur (RDP bandwidth).
general {
    hide_cursor = false
    grace = 0
}

background {
    monitor =
    color = rgb(1a2a3f)
}

label {
    monitor =
    text = cmd[update:30000] echo "$(hostname): console locked"
    color = rgb(8bb4e0)
    font_size = 22
    font_family = FiraCode Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 48
    outline_thickness = 2
    outer_color = rgb(8bb4e0)
    inner_color = rgb(243b55)
    font_color = rgb(fff8f0)
    check_color = rgb(c4933f)
    fail_color = rgb(c0392b)
    placeholder_text = password for $USER
    fade_on_empty = false
    rounding = 4
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = RDP sessions log in on their own: this lock is for the console
    color = rgb(7b96b4)
    font_size = 12
    font_family = FiraCode Nerd Font
    position = 0, -70
    halign = center
    valign = center
}
