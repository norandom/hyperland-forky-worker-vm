name: hypr-rdp .deb

# Builds hypr-rdp with the patches in files/hypr-rdp as a Debian (forky) package
# via the Dagger module in .dagger/. A tag like hypr-rdp-0.1.6-3 publishes a release.
on:
  push:
    tags: ["hypr-rdp-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger CLI
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.9 BIN_DIR=/usr/local/bin sudo -E sh

      - name: Build .deb (Dagger)
        env:
          DAGGER_NO_NAG: "1"
        run: mkdir -p dist && dagger call deb export --path=dist/ --allow-parent-dir-path

      - name: Show package
        run: ls -la "$GITHUB_WORKSPACE/dist" && dpkg-deb --info "$GITHUB_WORKSPACE"/dist/*.deb

      - name: Keep as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypr-rdp-clearcodec-deb
          path: dist/*.deb

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --title "$GITHUB_REF_NAME" \
            --notes "hypr-rdp 0.1.6 with the ClearCodec, planar and capture-pacing patches, built on Debian forky (Dagger)."
